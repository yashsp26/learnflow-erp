trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:

  - group: LearnFlowERP-Test

  - name: buildPlatform
    value: 'Any CPU'

  - name: buildConfiguration
    value: 'Release'

  - name: solution
    value: 'LearnFlowERP.sln'

  - name: frontendPath
    value: 'learnflowerp-frontend'

  - name: backendImage
    value: 'yashpatil2606/learnflowerp-backend-api'

stages:

# ==========================
# FRONTEND LINT
# ==========================
- stage: FrontendLint
  displayName: 'Frontend Lint'

  jobs:
    - job: Lint
      displayName: 'Run ESLint'

      steps:
        - checkout: self

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: CmdLine@2
          displayName: 'Install Dependencies & Run ESLint'
          inputs:
            workingDirectory: '$(frontendPath)'
            script: |
              node --version
              npm --version

              npm ci --include=dev
              npm run lint

# ==========================
# FRONTEND BUILD
# ==========================
- stage: FrontendBuild
  displayName: 'Frontend Build'
  dependsOn: FrontendLint

  jobs:
    - job: BuildFrontend
      displayName: 'Build Frontend'

      steps:
        - checkout: self

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: PowerShell@2
          displayName: 'Install & Build Frontend'
          inputs:
            targetType: inline
            workingDirectory: '$(frontendPath)'
            script: |
              Write-Host "Node Version:"
              node --version

              Write-Host "NPM Version:"
              npm --version

              Write-Host "Installing dependencies..."
              npm ci --include=dev

              if ($LASTEXITCODE -ne 0) {
                throw "npm ci failed"
              }

              Write-Host "Building frontend..."
              npm run build

              if ($LASTEXITCODE -ne 0) {
                throw "npm run build failed"
              }

              Write-Host "Contents after build:"
              Get-ChildItem -Force
              Get-ChildItem dist -Recurse

        - task: PowerShell@2
          displayName: 'Validate Frontend Output'
          inputs:
            targetType: inline
            script: |
              $distPath = "$(Build.SourcesDirectory)\$(frontendPath)\dist"

              Write-Host "Checking: $distPath"

              if (!(Test-Path $distPath)) {
                throw "dist folder was not generated."
              }

              Write-Host "dist folder exists."
              Get-ChildItem $distPath -Recurse

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Frontend Artifact'
          inputs:
            targetPath: '$(Build.SourcesDirectory)\$(frontendPath)\dist'
            artifact: 'frontend'
            
# ==========================
# BACKEND BUILD
# ==========================
- stage: BackendBuild
  displayName: 'Backend Build'
  dependsOn:
    - FrontendBuild

  jobs:
    - job: BuildBackend
      displayName: 'Build Backend'

      steps:
        - checkout: self

        - task: UseDotNet@2
          displayName: '.NET 8 SDK'
          inputs:
            packageType: sdk
            version: '8.0.x'

        - task: NuGetToolInstaller@1

        - task: NuGetCommand@2
          displayName: 'Restore NuGet Packages'
          inputs:
            restoreSolution: '$(solution)'

        - task: VSBuild@1
          displayName: 'Build Backend'
          inputs:
            solution: '$(solution)'
            platform: '$(buildPlatform)'
            configuration: '$(buildConfiguration)'
            clean: true

        - task: DotNetCoreCLI@2
          displayName: 'Publish API'
          inputs:
            command: publish
            publishWebProjects: false
            projects: 'backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj'
            arguments: >
              --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)/backend
            zipAfterPublish: false

        - task: PowerShell@2
          displayName: 'Verify Publish Output'
          inputs:
            targetType: inline
            script: |
              Write-Host "Published files:"
              Get-ChildItem "$(Build.ArtifactStagingDirectory)\backend" -Recurse

              $count = (Get-ChildItem "$(Build.ArtifactStagingDirectory)\backend" -Recurse | Measure-Object).Count
              Write-Host "Total files: $count"

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Backend Artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)\backend'
            artifact: 'backend'

# ==========================
# BACKEND TESTS
# ==========================
- stage: BackendTests
  displayName: 'Backend Tests'
  dependsOn: BackendBuild

  jobs:
    - job: RunTests
      displayName: 'Run Unit Tests'

      steps:
        - checkout: self

        - task: VSTest@2
          displayName: 'Run Unit Tests'
          inputs:
            testSelector: 'testAssemblies'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            platform: '$(buildPlatform)'
            configuration: '$(buildConfiguration)'

# ==========================
# SECURITY CHECKS
# ==========================
- stage: SecurityChecks
  displayName: 'Security Checks'
  dependsOn:
    - BackendTests

  jobs:
    - job: Security
      displayName: 'Dependency Scanning'

      steps:
        - checkout: self

        - task: UseDotNet@2
          inputs:
            packageType: sdk
            version: '8.0.x'

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: CmdLine@2
          displayName: 'Restore Backend'
          inputs:
            script: |
              dotnet restore backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj

        - task: CmdLine@2
          displayName: '.NET Vulnerability Scan'
          inputs:
            script: |
              dotnet list backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj package --vulnerable

        - task: CmdLine@2
          displayName: 'NPM Audit'
          inputs:
            script: |
              cd $(frontendPath)
              npm audit --audit-level=high

# ==========================
# GITLEAKS
# ==========================
- stage: Gitleaks
  displayName: 'Secret Scanning'

  dependsOn:
    - SecurityChecks

  jobs:
    - job: SecretScan

      pool:
        vmImage: 'ubuntu-latest'

      steps:

        - checkout: self
          fetchDepth: 0

        - bash: |
            docker run --rm \
              -v $(Build.SourcesDirectory):/repo \
              ghcr.io/gitleaks/gitleaks:latest detect \
              --source=/repo \
              --no-git
          displayName: 'Run Gitleaks'

# ==========================
# SEMGREP
# ==========================
- stage: Semgrep
  displayName: 'Code Security Scan'

  dependsOn:
    - Gitleaks

  jobs:

  - job: ScanCode

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - bash: |
        pip install semgrep

        semgrep scan \
          --config auto
      displayName: Run Semgrep

# ==========================
# DOCKER VALIDATION
# ==========================
- stage: DockerValidation
  displayName: 'Docker Validation'
  dependsOn:
    - Semgrep

  jobs:
    - job: DockerValidation
      displayName: 'Validate Docker Compose'

      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self

        - script: |
            docker --version
            docker compose version
          displayName: 'Docker Version'

        - script: |
            docker compose config
          displayName: 'Validate docker-compose.yml'

        - script: |
            docker compose build
          displayName: 'Build Docker Images'

# ==========================
# TRIVYSCAN
# ==========================
- stage: TrivyScan
  displayName: 'Container Security Scan'

  dependsOn:
    - DockerValidation

  jobs:
  - job: ScanImage

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - bash: |
        docker build \
          -f backend/LearnFlowERP.Api/Dockerfile \
          -t learnflow-scan:latest \
          .
      displayName: Build Scan Image

    - bash: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          learnflow-scan:latest
      displayName: Run Trivy
      
# ==========================
# DOCKER PUSH
# ==========================
- stage: DockerPush
  displayName: 'Build & Push Docker Images'

  dependsOn:
    - TrivyScan

  condition: and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/master')
    )

  jobs:
    - job: DockerPush
      displayName: 'Push Backend Images'

      pool:
        vmImage: 'ubuntu-latest'

      steps:

        - checkout: self
          fetchDepth: 0

        - bash: |
            SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)

            echo "Short SHA: $SHORT_SHA"

            echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
          displayName: 'Generate Short SHA'

        - task: Docker@2
          displayName: 'Docker Hub Login'
          inputs:
            command: login
            containerRegistry: 'DockerHubConnection'

        # Backend

        - task: Docker@2
          displayName: 'Build & Push Backend'
          inputs:
            command: buildAndPush
            repository: $(backendImage)
            dockerfile: 'backend/LearnFlowERP.Api/Dockerfile'
            buildContext: '$(Build.SourcesDirectory)'
            containerRegistry: 'DockerHubConnection'
            tags: |
              latest
              $(SHORT_SHA)


        - bash: |
            echo "Backend:"
            echo "$(backendImage):latest"
            echo "$(backendImage):$(SHORT_SHA)"

            echo ""

          displayName: 'Summary'

# ==========================
# DEPLOY BACKEND
# ==========================
- stage: DeployBackend
  displayName: 'Deploy Backend'

  dependsOn: DockerPush

  condition: and(
    succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/master')
    )

  jobs:

  - job: Deploy

    pool:
      vmImage: ubuntu-latest

    steps:

    - bash: |
        echo "Triggering Render deployment..."
        curl -X POST "$(RENDER_BACKEND_DEPLOY_HOOK)"
      displayName: 'Trigger Render Deploy'