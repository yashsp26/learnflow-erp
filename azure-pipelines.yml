trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  solution: 'LearnFlowERP.sln'
  frontendPath: 'learnflowerp-frontend'

# ==================================================
# FRONTEND LINT
# ==================================================
stages:

- stage: FrontendLint
  displayName: 'Frontend Lint'

  jobs:
  - job: Lint
    displayName: 'Run ESLint'

    steps:
    - checkout: self

    - task: UseNode@1
      inputs:
        version: '22.x'

    - script: |
        cd $(frontendPath)
        npm ci --include=dev
        npm run lint
      displayName: 'Lint Frontend'

# ==================================================
# FRONTEND BUILD
# ==================================================
- stage: FrontendBuild
  displayName: 'Frontend Build'
  dependsOn: FrontendLint

  jobs:
  - job: BuildFrontend
    displayName: 'Build Frontend'

    steps:
    - checkout: self

    - task: UseNode@1
      inputs:
        version: '22.x'

    - script: |
        cd $(frontendPath)
        npm ci --include=dev
        npm ls typescript
        dir node_modules\.bin
        npm run build
      displayName: 'Build Frontend'

    - powershell: |
        Write-Host "Build.SourcesDirectory = $(Build.SourcesDirectory)"

        Write-Host ""
        Write-Host "Repository Root:"
        Get-ChildItem "$(Build.SourcesDirectory)"

        Write-Host ""
        Write-Host "Frontend Folder:"
        Get-ChildItem "$(Build.SourcesDirectory)\$(frontendPath)"

        Write-Host ""
        Write-Host "Dist Folder:"
        Get-ChildItem "$(Build.SourcesDirectory)\$(frontendPath)\dist" -ErrorAction SilentlyContinue
      displayName: 'Verify Frontend Output'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifact'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)\$(frontendPath)\dist'
        ArtifactName: 'frontend'
      condition: succeeded()

# ==================================================
# BACKEND BUILD
# ==================================================
- stage: BackendBuild
  displayName: 'Backend Build'
  dependsOn: FrontendBuild

  jobs:
  - job: BuildBackend
    displayName: 'Build Backend'

    steps:
    - checkout: self

    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      displayName: 'Restore NuGet Packages'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Build Backend'
      inputs:
        solution: '$(solution)'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifact'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)'
        ArtifactName: 'backend'

# ==================================================
# BACKEND TESTS
# ==================================================
- stage: BackendTests
  displayName: 'Backend Tests'
  dependsOn: BackendBuild

  jobs:
  - job: RunTests
    displayName: 'Run Unit Tests'

    steps:
    - checkout: self

    - task: VSTest@2
      displayName: 'Run Unit Tests'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'