trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  - name: buildPlatform
    value: 'Any CPU'

  - name: buildConfiguration
    value: 'Release'

  - name: solution
    value: 'LearnFlowERP.sln'

  - name: frontendPath
    value: 'learnflowerp-frontend'

stages:

# ==========================
# FRONTEND LINT
# ==========================
- stage: FrontendLint
  displayName: 'Frontend Lint'

  jobs:
    - job: Lint
      displayName: 'Run ESLint'

      steps:
        - checkout: self

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: CmdLine@2
          displayName: 'Install Dependencies & Run ESLint'
          inputs:
            workingDirectory: '$(frontendPath)'
            script: |
              node --version
              npm --version

              npm ci --include=dev
              npm run lint

# ==========================
# FRONTEND BUILD
# ==========================
- stage: FrontendBuild
  displayName: 'Frontend Build'
  dependsOn: FrontendLint

  jobs:
    - job: BuildFrontend
      displayName: 'Build Frontend'

      steps:
        - checkout: self

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: CmdLine@2
          displayName: 'Install & Build Frontend'
          inputs:
            workingDirectory: '$(frontendPath)'
            script: |
              node --version
              npm --version

              call npm ci --include=dev
              IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%

              call npm run build
              IF %ERRORLEVEL% NEQ 0 EXIT /B %ERRORLEVEL%

        - task: PowerShell@2
          displayName: 'Validate Frontend Output'
          inputs:
            targetType: inline
            script: |
              $distPath = "$(Build.SourcesDirectory)\$(frontendPath)\dist"

              if (!(Test-Path $distPath)) {
                Write-Error "dist folder was not generated."
                exit 1
              }

              Write-Host "dist folder exists."
              Get-ChildItem $distPath -Recurse

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Frontend Artifact'
          inputs:
            PathtoPublish: '$(Build.SourcesDirectory)\$(frontendPath)\dist'
            ArtifactName: 'frontend'

# ==========================
# BACKEND BUILD
# ==========================
- stage: BackendBuild
  displayName: 'Backend Build'
  dependsOn: FrontendBuild

  jobs:
    - job: BuildBackend
      displayName: 'Build Backend'

      steps:
        - checkout: self

        - task: UseDotNet@2
          displayName: '.NET 8 SDK'
          inputs:
            packageType: sdk
            version: '8.0.x'

        - task: NuGetToolInstaller@1

        - task: NuGetCommand@2
          displayName: 'Restore NuGet Packages'
          inputs:
            restoreSolution: '$(solution)'

        - task: VSBuild@1
          displayName: 'Build Backend'
          inputs:
            solution: '$(solution)'
            platform: '$(buildPlatform)'
            configuration: '$(buildConfiguration)'
            clean: true

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Backend Artifact'
          inputs:
            PathtoPublish: '$(Build.SourcesDirectory)'
            ArtifactName: 'backend'

# ==========================
# BACKEND TESTS
# ==========================
- stage: BackendTests
  displayName: 'Backend Tests'
  dependsOn: BackendBuild

  jobs:
    - job: RunTests
      displayName: 'Run Unit Tests'

      steps:
        - checkout: self

        - task: VSTest@2
          displayName: 'Run Unit Tests'
          inputs:
            testSelector: 'testAssemblies'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            platform: '$(buildPlatform)'
            configuration: '$(buildConfiguration)'

# ==========================
# SECURITY CHECKS
# ==========================
- stage: SecurityChecks
  displayName: 'Security Checks'
  dependsOn: BackendTests

  jobs:
    - job: Security
      displayName: 'Dependency Scanning'

      steps:
        - checkout: self

        - task: UseDotNet@2
          inputs:
            packageType: sdk
            version: '8.0.x'

        - task: UseNode@1
          inputs:
            version: '22.x'

        - script: |
            dotnet list backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj package --vulnerable
          displayName: '.NET Vulnerability Scan'

        - script: |
            cd $(frontendPath)
            npm audit --audit-level=high
          displayName: 'NPM Audit'

# ==========================
# DOCKER VALIDATION
# ==========================
- stage: DockerValidation
  displayName: 'Docker Validation'
  dependsOn: SecurityChecks

  jobs:
    - job: DockerValidation
      displayName: 'Validate Docker Compose'

      steps:
        - checkout: self

        - task: DockerInstaller@0
          inputs:
            dockerVersion: 'latest'

        - script: |
            docker --version
            docker compose version
          displayName: 'Docker Version'

        - script: |
            docker compose config
          displayName: 'Validate docker-compose.yml'

        - script: |
            docker compose build
          displayName: 'Build Docker Images'