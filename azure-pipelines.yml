trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  - name: buildPlatform
    value: 'Any CPU'

  - name: buildConfiguration
    value: 'Release'

  - name: solution
    value: 'LearnFlowERP.sln'

  - name: frontendPath
    value: 'learnflowerp-frontend'

stages:

# ==========================
# FRONTEND LINT
# ==========================
- stage: FrontendLint
  displayName: 'Frontend Lint'

  jobs:
    - job: Lint
      displayName: 'Run ESLint'

      steps:
        - checkout: self

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: CmdLine@2
          displayName: 'Install Dependencies & Run ESLint'
          inputs:
            workingDirectory: '$(frontendPath)'
            script: |
              node --version
              npm --version

              npm ci --include=dev
              npm run lint

# ==========================
# FRONTEND BUILD
# ==========================
- stage: FrontendBuild
  displayName: 'Frontend Build'
  dependsOn: FrontendLint

  jobs:
    - job: BuildFrontend
      displayName: 'Build Frontend'

      steps:
        - checkout: self

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: PowerShell@2
          displayName: 'Install & Build Frontend'
          inputs:
            targetType: inline
            workingDirectory: '$(frontendPath)'
            script: |
              Write-Host "Node Version:"
              node --version

              Write-Host "NPM Version:"
              npm --version

              Write-Host "Installing dependencies..."
              npm ci --include=dev

              if ($LASTEXITCODE -ne 0) {
                throw "npm ci failed"
              }

              Write-Host "Building frontend..."
              npm run build

              if ($LASTEXITCODE -ne 0) {
                throw "npm run build failed"
              }

              Write-Host "Contents after build:"
              Get-ChildItem -Force
              Get-ChildItem dist -Recurse

        - task: PowerShell@2
          displayName: 'Validate Frontend Output'
          inputs:
            targetType: inline
            script: |
              $distPath = "$(Build.SourcesDirectory)\$(frontendPath)\dist"

              Write-Host "Checking: $distPath"

              if (!(Test-Path $distPath)) {
                throw "dist folder was not generated."
              }

              Write-Host "dist folder exists."
              Get-ChildItem $distPath -Recurse

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Frontend Artifact'
          inputs:
            targetPath: '$(Build.SourcesDirectory)\$(frontendPath)\dist'
            artifact: 'frontend'
            
# ==========================
# BACKEND BUILD
# ==========================
- stage: BackendBuild
  displayName: 'Backend Build'
  dependsOn:
    - FrontendBuild

  jobs:
    - job: BuildBackend
      displayName: 'Build Backend'

      steps:
        - checkout: self

        - task: UseDotNet@2
          displayName: '.NET 8 SDK'
          inputs:
            packageType: sdk
            version: '8.0.x'

        - task: NuGetToolInstaller@1

        - task: NuGetCommand@2
          displayName: 'Restore NuGet Packages'
          inputs:
            restoreSolution: '$(solution)'

        - task: VSBuild@1
          displayName: 'Build Backend'
          inputs:
            solution: '$(solution)'
            platform: '$(buildPlatform)'
            configuration: '$(buildConfiguration)'
            clean: true

        - task: DotNetCoreCLI@2
          displayName: 'Publish API'
          inputs:
            command: publish
            publishWebProjects: false
            projects: 'backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj'
            arguments: >
              --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)/backend
            zipAfterPublish: false

        - task: PowerShell@2
          displayName: 'Verify Publish Output'
          inputs:
            targetType: inline
            script: |
              Write-Host "Published files:"
              Get-ChildItem "$(Build.ArtifactStagingDirectory)\backend" -Recurse

              $count = (Get-ChildItem "$(Build.ArtifactStagingDirectory)\backend" -Recurse | Measure-Object).Count
              Write-Host "Total files: $count"

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Backend Artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)\backend'
            artifact: 'backend'

# ==========================
# BACKEND TESTS
# ==========================
- stage: BackendTests
  displayName: 'Backend Tests'
  dependsOn: BackendBuild

  jobs:
    - job: RunTests
      displayName: 'Run Unit Tests'

      steps:
        - checkout: self

        - task: VSTest@2
          displayName: 'Run Unit Tests'
          inputs:
            testSelector: 'testAssemblies'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            platform: '$(buildPlatform)'
            configuration: '$(buildConfiguration)'

# ==========================
# SECURITY CHECKS
# ==========================
- stage: SecurityChecks
  displayName: 'Security Checks'
  dependsOn:
    - BackendTests

  jobs:
    - job: Security
      displayName: 'Dependency Scanning'

      steps:
        - checkout: self

        - task: UseDotNet@2
          inputs:
            packageType: sdk
            version: '8.0.x'

        - task: UseNode@1
          inputs:
            version: '22.x'

        - task: CmdLine@2
          displayName: 'Restore Backend'
          inputs:
            script: |
              dotnet restore backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj

        - task: CmdLine@2
          displayName: '.NET Vulnerability Scan'
          inputs:
            script: |
              dotnet list backend/LearnFlowERP.Api/LearnFlowERP.Api.csproj package --vulnerable

        - task: CmdLine@2
          displayName: 'NPM Audit'
          inputs:
            script: |
              cd $(frontendPath)
              npm audit --audit-level=high

# ==========================
# DOCKER VALIDATION
# ==========================
- stage: DockerValidation
  displayName: 'Docker Validation'
  dependsOn: SecurityChecks

  jobs:
    - job: DockerValidation
      displayName: 'Validate Docker Compose'

      steps:
        - checkout: self

        - task: DockerInstaller@0
          inputs:
            dockerVersion: 'latest'

        - script: |
            docker --version
            docker compose version
          displayName: 'Docker Version'

        - script: |
            docker compose config
          displayName: 'Validate docker-compose.yml'

        - script: |
            docker compose build
          displayName: 'Build Docker Images'