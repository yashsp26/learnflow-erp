trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  solution: 'LearnFlowERP.sln'
  frontendPath: 'learnflowerp-frontend'

stages:

# ==================================================
# FRONTEND LINT
# ==================================================
- stage: FrontendLint
  displayName: 'Frontend Lint'

  jobs:
  - job: Lint
    displayName: 'Run ESLint'

    steps:
    - checkout: self

    - task: UseNode@1
      inputs:
        version: '22.x'

    - script: |
        node --version
        npm --version

        npm ci --include=dev
        npm run lint
      workingDirectory: '$(frontendPath)'
      displayName: 'Install Dependencies & Run ESLint'

# ==================================================
# FRONTEND BUILD
# ==================================================
- stage: FrontendBuild
  displayName: 'Frontend Build'
  dependsOn: FrontendLint

  jobs:
  - job: BuildFrontend
    displayName: 'Build Frontend'

    steps:
    - checkout: self

    - task: UseNode@1
      inputs:
        version: '22.x'

    - script: |
        echo ===== NODE =====
        node --version

        echo ===== NPM =====
        npm --version

        echo ===== INSTALL =====
        npm ci --include=dev

        echo ===== TYPESCRIPT =====
        npm ls typescript

        echo ===== BUILD =====
        npm run build
      workingDirectory: '$(frontendPath)'
      displayName: 'Install & Build Frontend'

    - powershell: |
        Write-Host "Checking dist folder..."

        if (!(Test-Path "$(Build.SourcesDirectory)\$(frontendPath)\dist"))
        {
            Write-Error "dist folder was not generated."
            exit 1
        }

        Write-Host "dist folder exists."

        Get-ChildItem "$(Build.SourcesDirectory)\$(frontendPath)\dist" -Recurse
      displayName: 'Validate Frontend Output'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifact'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)\$(frontendPath)\dist'
        ArtifactName: 'frontend'

# ==================================================
# BACKEND BUILD
# ==================================================
- stage: BackendBuild
  displayName: 'Backend Build'
  dependsOn: FrontendBuild

  jobs:
  - job: BuildBackend
    displayName: 'Build Backend'

    steps:
    - checkout: self

    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      displayName: 'Restore NuGet Packages'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Build Backend'
      inputs:
        solution: '$(solution)'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
        clean: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifact'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)'
        ArtifactName: 'backend'

# ==================================================
# BACKEND TESTS
# ==================================================
- stage: BackendTests
  displayName: 'Backend Tests'
  dependsOn: BackendBuild

  jobs:
  - job: RunTests
    displayName: 'Run Unit Tests'

    steps:
    - checkout: self

    - task: VSTest@2
      displayName: 'Run Unit Tests'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
        testSelector: 'testAssemblies'
        searchFolder: '$(System.DefaultWorkingDirectory)'